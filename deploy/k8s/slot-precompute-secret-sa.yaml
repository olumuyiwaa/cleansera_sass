apiVersion: v1
kind: Secret
metadata:
  name: cleansera-secrets
  namespace: default
type: Opaque
stringData:
  # Replace with real values or create via kubectl create secret
  DATABASE_URL: "postgresql://user:pass@db-host:5432/cleansera"
  REDIS_URL: "redis://:password@redis-host:6379/0"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleansera-worker
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleansera-worker-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleansera-worker-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: cleansera-worker
    namespace: default
roleRef:
  kind: Role
  name: cleansera-worker-role
  apiGroup: rbac.authorization.k8s.io
