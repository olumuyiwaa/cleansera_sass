## NOTE: do NOT store real secrets in checked-in YAML. Create the secret
## using kubectl, e.g.:
## kubectl create secret generic cleansera-secrets --from-literal=DATABASE_URL='postgresql://user:pass@db:5432/cleansera' --from-literal=REDIS_URL='redis://:pass@redis:6379/0'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleansera-worker
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleansera-worker-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleansera-worker-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: cleansera-worker
    namespace: default
roleRef:
  kind: Role
  name: cleansera-worker-role
  apiGroup: rbac.authorization.k8s.io
